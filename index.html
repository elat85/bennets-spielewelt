<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#7ec850">
  <title>Bennets Spielewelt</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/fredoka-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"></div>

  <script src="js/storage.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/art.js"></script>
  <script src="js/games/huehner.js"></script>
  <script src="js/games/dino.js"></script>
  <script src="js/games/einhorn.js"></script>
  <script src="js/games/garten.js"></script>
  <script src="js/games/kissen.js"></script>
  <script src="js/games/trampolin.js"></script>
  <script src="js/games/schaukel.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Offline-Cache nur im echten Betrieb, nicht beim lokalen Entwickeln.
    // Bei neuer Version: Hinweis zeigen, Antippen lädt sofort neu.
    if ('serviceWorker' in navigator && location.hostname !== 'localhost') {
      window.addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('sw.js');
          function offerUpdate(worker) {
            if (document.querySelector('.update-toast')) return;
            const toast = document.createElement('div');
            toast.className = 'update-toast';
            toast.textContent = '✨ Neue Version! Hier tippen';
            toast.addEventListener('pointerdown', () => {
              worker.postMessage('SKIP_WAITING');
              toast.remove();
            });
            document.body.appendChild(toast);
          }
          if (reg.waiting && navigator.serviceWorker.controller) offerUpdate(reg.waiting);
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            nw && nw.addEventListener('statechange', () => {
              if (nw.state === 'installed' && navigator.serviceWorker.controller) offerUpdate(nw);
            });
          });
          let reloaded = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (!reloaded) { reloaded = true; location.reload(); }
          });
        } catch (e) { /* offline o.ä. */ }
      });
    }
  </script>
</body>
</html>
